<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday My Love</title>
  <!-- Google Fonts for bold retro display + clean italic subtext -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,600&family=Titan+One&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #38091b 0%, #14030a 58%, #020002 100%);
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Intro Button Screen */
    #intro-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    #open-btn {
      padding: 18px 46px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #4a1224;
      background: linear-gradient(135deg, #fff5f8 0%, #ffd6e5 50%, #ffb3cf 100%);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      cursor: pointer;
      box-shadow:
        0 0 25px rgba(255, 190, 215, 0.9),
        0 0 60px rgba(255, 95, 155, 0.75),
        inset 0 0 12px rgba(255, 255, 255, 0.9);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: pulseBtn 2.2s infinite ease-in-out;
    }

    #open-btn:hover {
      transform: scale(1.07);
      box-shadow:
        0 0 35px rgba(255, 210, 228, 1),
        0 0 80px rgba(255, 100, 160, 0.95);
    }

    @keyframes pulseBtn {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    /* Main Birthday Content Inside the Heart */
    #wish-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding: 20px;
      text-align: center;
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 1.4s ease 0.35s, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
      pointer-events: none;
    }

    #wish-container.visible {
      opacity: 1;
      transform: scale(1);
    }

    .photo-glow-wrapper {
      width: min(210px, 34vw);
      height: min(210px, 34vw);
      margin-bottom: 18px;
      filter:
        drop-shadow(0 0 14px rgba(255, 240, 246, 0.95))
        drop-shadow(0 0 32px rgba(255, 120, 175, 0.85));
      animation: floatPhoto 3.6s ease-in-out infinite;
    }

    .heart-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: url(#heartClip);
      -webkit-clip-path: url(#heartClip);
      background: #ffe6ef;
    }

    @keyframes floatPhoto {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.025);
      }
    }

    .birthday-title {
      font-family: 'Titan One', cursive;
      font-size: clamp(1.6rem, 4.2vw, 3.3rem);
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1.2;
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.8),
        0 0 28px rgba(255, 110, 165, 0.9),
        0 4px 12px rgba(0, 0, 0, 0.6);
      margin-bottom: 10px;
    }

    .birthday-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      letter-spacing: 3px;
      color: #ffe8f0;
      text-shadow:
        0 0 10px rgba(255, 150, 190, 0.8),
        0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* Hidden SVG used for crisp heart clipping */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <!-- Smooth Heart Clip Path -->
  <svg class="svg-defs" viewBox="0 0 1 1">
    <defs>
      <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
        <path
          d="M 0.5,0.92
             C 0.5,0.92 0.04,0.62 0.04,0.32
             C 0.04,0.14 0.18,0.04 0.33,0.04
             C 0.43,0.04 0.48,0.10 0.50,0.17
             C 0.52,0.10 0.57,0.04 0.67,0.04
             C 0.82,0.04 0.96,0.14 0.96,0.32
             C 0.96,0.62 0.5,0.92 0.5,0.92 Z"
        />
      </clipPath>
    </defs>
  </svg>

  <canvas id="scene"></canvas>

  <!-- Step 1: Click Here Button -->
  <div id="intro-screen">
    <button id="open-btn">Click Here to Open</button>
  </div>

    document.getElementById("wish-title").textContent = CONFIG.title;
    document.getElementById("wish-subtitle").textContent = CONFIG.subtitle;
    document.getElementById("wish-photo").src = CONFIG.photourl;
    document.getElementById("open-btn").textContent = CONFIG.buttonText;

    // ==========================================
    // CANVAS STARFIELD & PARTICLE HEART ENGINE
    // ==========================================
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Background twinkling stars
    const stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      alpha: Math.random() * 0.7 + 0.2,
      twinkleSpeed: Math.random() * 0.03 + 0.01
    }));

    // Parametric heart formula
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      return {
        x: width / 2 + x * scale,
        y: height / 2 + (y + 2.2) * scale
      };
    }

    // Heart trail particles
    const HEART_PARTICLE_COUNT = 420;
    const heartParticles = [];
    let isOpened = false;
    let openTimestamp = 0;

    function createHeartParticles() {
      heartParticles.length = 0;
      for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
        const t = (i / HEART_PARTICLE_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
        const angle = Math.random() * Math.PI * 2;
        const burstSpeed = Math.random() * 16 + 6;
        const colors = ["#ffffff", "#ffd1e3", "#ff8ab8", "#ff4d94", "#ffc2d9"];
        heartParticles.push({
          x: width / 2,
          y: height / 2,
          prevX: width / 2,
          prevY: height / 2,
          vx: Math.cos(angle) * burstSpeed,
          vy: Math.sin(angle) * burstSpeed,
          t: t,
          tSpeed: (Math.random() * 0.006 + 0.004) * (i % 2 === 0 ? 1 : 0.7),
          offsetRadius: (Math.random() - 0.5) * 24,
          size: Math.random() * 2 + 0.8,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random() * 0.6 + 0.4
        });
      }
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw subtle twinkling background stars
      for (const s of stars) {
        s.x += s.vx;
        s.y += s.vy;
        s.alpha += Math.sin(now * s.twinkleSpeed) * 0.015;

        if (s.x < 0) s.x = width;
        if (s.x > width) s.x = 0;
        if (s.y < 0) s.y = height;
        if (s.y > height) s.y = 0;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 230, ${Math.max(0.1, Math.min(0.95, s.alpha))})`;
        ctx.fill();
      }

      // 2. Draw heart particle burst & swirling outline after button click
      if (isOpened) {
        const elapsed = (now - openTimestamp) / 1000;
        const heartScale = Math.min(width, height) / 38;
        const pulse = 1 + Math.sin(elapsed * 2.4) * 0.025;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (const p of heartParticles) {
          p.prevX = p.x;
          p.prevY = p.y;

          if (elapsed < 0.65) {
            // Initial firework burst outward from the center
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.96;
            p.vy *= 0.96;
          } else {
            // Smoothly orbit & trace the giant glowing heart outline
            p.t += p.tSpeed;
            const target = getHeartPoint(p.t, heartScale * pulse);
            const normalAngle = p.t;
            const tx = target.x + Math.cos(normalAngle) * p.offsetRadius;
            const ty = target.y + Math.sin(normalAngle) * p.offsetRadius;

            p.vx = (p.vx + (tx - p.x) * 0.045) * 0.82;
            p.vy = (p.vy + (ty - p.y) * 0.045) * 0.82;
            p.x += p.vx;
            p.y += p.vy;
          }

          // Draw glowing streak from previous position to current position
          ctx.beginPath();
          ctx.moveTo(p.prevX, p.prevY);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.lineWidth = p.size;
          ctx.lineCap = "round";
          ctx.stroke();

          // Small bright tip dot
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        }

        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // Button click handler
    const openBtn = document.getElementById("open-btn");
    const introScreen = document.getElementById("intro-screen");
    const wishContainer = document.getElementById("wish-container");

    openBtn.addEventListener("click", () => {
      introScreen.classList.add("hidden");
      wishContainer.classList.add("visible");

      createHeartParticles();
      openTimestamp = performance.now();
      isOpened = true;

      const audio = document.getElementById("bg-music");
      if (audio) {
        audio.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
